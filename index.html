<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oeil</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- SCRIPTS -->
    <script src="js/eye-textures.js" defer></script>
    <script src="js/eye-renderer.js" defer></script>
    <script src="js/lookat-mouse.js" defer></script>
    <script src="js/no-rightclick.js" defer></script>
    <script src="js/eye-light.js" defer></script>
    <script src="js/player-cursor.js" defer></script>

</head>

<body>
    <main class="eye-holder">
        <span class="player-sprite" aria-hidden="true" hidden></span>
        <header class="home-intro">
            <h1>l'oeil</h1>
            <p>suis son regard.</p>
        </header>
        <svg class="eye-beam" aria-hidden="true">
            <defs>
                <mask id="veil-light-mask" maskUnits="userSpaceOnUse" mask-type="alpha" x="0" y="0" width="100%"
                    height="100%">
                    <use href="#beam-light" />
                </mask>
                <filter id="fog-tint">
                    <feFlood style="flood-color: var(--room-color)" />
                    <feComposite in2="SourceAlpha" operator="in" />
                </filter>
                <path id="beam-shape"></path>
                <filter id="soft-reveal" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                    <feGaussianBlur stdDeviation="8" />
                </filter>

                <mask id="beam-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                    <use href="#beam-shape" fill="white" filter="url(#soft-reveal)" />
                </mask>
                <linearGradient id="beam-fade" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#c78e8a" stop-opacity="0.34" />
                    <stop offset="0.55" stop-color="#c78e8a" stop-opacity="0.14" />
                    <stop offset="1" stop-color="#c78e8a" stop-opacity="0" />
                </linearGradient>
            </defs>

            <g id="beam-light">
                <use class="beam-glow" href="#beam-shape" fill="url(#beam-fade)" />
            </g>
        </svg>
        <canvas class="eye look-at-mouse eye-large" width="320" height="320"></canvas>
        <div class="fog" aria-hidden="true"></div>
        <div class="fog fog-flipped" aria-hidden="true"></div>
        <div class="indice">
            <p>tu peux fermer les yeux,</p>
            <p>il te verra quand même.</p>
            <a href="musee.html">visiter la musée</a>
        </div>
    </main>
</body>

</html>

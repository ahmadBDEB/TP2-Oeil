<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COURS COURS COURS COURS COURS COURS COURS COURS</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- SCRIPTS -->

    <script src="js/no-rightclick.js" defer></script>
    <script src="js/eye-textures.js" defer></script>
    <script src="js/eye-renderer.js" defer></script>
    <script src="js/eye-light.js" defer></script>
    <script src="js/run.js" defer></script>

</head>

<body>
    <main class="run-room page-fade">
        <h1>tu es y presque</h1>
        <p>wasd/fleches pour bouger</p>
        <p class="run-countdown" role="timer" aria-label="temps restant">30 s</p>
        <div class="run-hall">
            <svg class="eye-beam" aria-hidden="true">
                <defs>
                    <path id="beam-shape" />
                    <filter id="run-soft-edge" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                        <feGaussianBlur stdDeviation="16" />
                    </filter>
                    <mask id="run-darkness" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                        <rect width="100%" height="100%" fill="white" />
                        <use href="#beam-shape" fill="black" filter="url(#run-soft-edge)" />
                    </mask>
                    <linearGradient id="beam-fade" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#c78e8a" stop-opacity="0.34" />
                        <stop offset="1" stop-color="#c78e8a" stop-opacity="0" />
                    </linearGradient>
                </defs>

                <rect width="100%" height="100%" fill="#08070a" mask="url(#run-darkness)" />
                <use class="beam-glow" href="#beam-shape" fill="url(#beam-fade)" />
            </svg>
            <span class="run-player" aria-hidden="true"></span>
            <canvas class="eye eye-small run-eye" width="160" height="160" aria-hidden="true"></canvas>
        </div>
    </main>
</body>

</html>

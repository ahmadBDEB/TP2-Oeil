<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>le labyrinthe</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- SCRIPTS -->

    <script src="js/no-rightclick.js" defer></script>
    <script src="js/eye-textures.js" defer></script>
    <script src="js/eye-renderer.js" defer></script>
    <script src="js/eye-light.js" defer></script>
    <script src="js/maze.js" defer></script>

</head>

<body>
    <main class="maze-room page-fade">
        <h1>le labyrinthe</h1>
        <div class="maze-view">
            <div class="maze-board"></div>

            <svg class="eye-beam" aria-hidden="true">
                <defs>
                    <path id="beam-shape" />
                    <filter id="maze-soft-edge" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                        <feGaussianBlur stdDeviation="7" />
                    </filter>
                    <mask id="maze-darkness" maskUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
                        <rect width="100%" height="100%" fill="white" />
                        <use href="#beam-shape" fill="black" filter="url(#maze-soft-edge)" />
                    </mask>
                    <linearGradient id="beam-fade" gradientUnits="userSpaceOnUse">
                        <stop offset="0" stop-color="#c78e8a" stop-opacity="0.34" />
                        <stop offset="0.55" stop-color="#c78e8a" stop-opacity="0.14" />
                        <stop offset="1" stop-color="#c78e8a" stop-opacity="0" />
                    </linearGradient>
                </defs>

                <rect width="100%" height="100%" fill="#08070a" mask="url(#maze-darkness)" />
                <use class="beam-glow" href="#beam-shape" fill="url(#beam-fade)" />
            </svg>

            <canvas class="eye eye-small maze-eye" width="160" height="160" aria-hidden="true"></canvas>
            <span class="maze-player" aria-hidden="true"></span>
        </div>
    </main>
</body>

</html>
